                $.fn.dataTable.ext.search.push(function(settings,row){if(settings.nTable.id!==nTableId)return true;var expr=exprInput.val().trim();if(expr==='')return true;var parsed=parseExpr(expr);if(parsed.conditions.length===0&&parsed.multiVals.length===0)return true;var val=parseNum(row[colIdx]);if(isNaN(val))return false;if(parsed.multiVals.length>0)return parsed.multiVals.indexOf(val)!==-1;return parsed.conditions.every(function(c){switch(c.op){case'>':return val>c.val;case'<':return val<c.val;case'>=':return val>=c.val;case'<=':return val<=c.val;case'=':return val===c.val;default:return true;}});});
                exprInput.on('keyup change',function(){column.draw();});
              })(exprInput,column,colIdx,nTableId);
              th.append(exprInput);
            } else {
              var uniqueVals=[...new Set(data)].filter(v=>v!=='').sort(function(a,b){return stripHtml(a).localeCompare(stripHtml(b));});
              var dropdown=$('<div class="multiselect-dropdown"></div>');
              var btn=$('<button type="button" class="dropdown-btn"><span class="btn-text">All</span><i class="bi bi-chevron-down"></i></button>');
              var menu=$('<div class="dropdown-menu"></div>');
              var saId='sa_T'+idx+'_C'+colIdx;
              var selectAllItem=$('<div class="dropdown-item select-all-item"><input type="checkbox" id="'+saId+'" checked><label for="'+saId+'">Select All</label></div>');
              menu.append(selectAllItem); var checkedVals=new Set(uniqueVals),allSelected=true;
              uniqueVals.forEach(function(val,i){var itemId='it_T'+idx+'_C'+colIdx+'_'+i;var item=$('<div class="dropdown-item"></div>');var cb=$('<input type="checkbox" checked>').attr('id',itemId).val(val);var lbl=$('<label></label>').attr('for',itemId).text(stripHtml(val));item.append(cb).append(lbl);menu.append(item);});
              dropdown.append(btn).append(menu);
              btn.on('click',function(e){e.stopPropagation();if(!menu.hasClass('show')){var btnPos=btn[0].getBoundingClientRect();menu.appendTo('body').css({position:'fixed',top:btnPos.bottom+'px',left:btnPos.left+'px',width:Math.max(btnPos.width,200)+'px'}).addClass('show');}else{menu.removeClass('show').appendTo(dropdown);}});
              (function(menu,btn,column,colIdx,checkedVals,allSelected,nTableId,saId){
                $.fn.dataTable.ext.search.push(function(settings,searchData,dataIndex,rowData){if(settings.nTable.id!==nTableId)return true;if(allSelected)return true;return checkedVals.has(rowData[colIdx]);});
                function updateFilter(){var checked=menu.find('input[type="checkbox"]:not(#'+saId+'):checked');var total=menu.find('input[type="checkbox"]:not(#'+saId+')').length;checkedVals.clear();checked.each(function(){checkedVals.add($(this).val());});allSelected=(checked.length===total);if(checked.length===0){btn.find('.btn-text').html('None');}else if(allSelected){btn.find('.btn-text').html('All');}else{btn.find('.btn-text').html(checked.length+' selected');}selectAllItem.find('input').prop('checked',allSelected).prop('indeterminate',checked.length>0&&!allSelected);column.draw();}
                menu.find('input[type="checkbox"]:not(#'+saId+')').on('change',updateFilter);selectAllItem.find('input').on('change',function(){menu.find('input[type="checkbox"]:not(#'+saId+')').prop('checked',$(this).prop('checked'));updateFilter();});
              })(menu,btn,column,colIdx,checkedVals,allSelected,nTableId,saId);
              th.append(dropdown);
            }
          });
          if(!window._tpDocClickBound){window._tpDocClickBound=true;$(document).on('click',function(e){$('.multiselect-dropdown').each(function(){var dd=$(this),m=dd.find('.dropdown-menu').add($('body > .dropdown-menu'));if(!dd.is(e.target)&&dd.has(e.target).length===0&&!m.is(e.target)&&m.has(e.target).length===0){m.filter('.show').removeClass('show').appendTo(dd);}});});}
          var filterRow = $(api.table().node()).find('.filter-row');
          api.on('column-visibility.dt', function(e, settings, colIdx, visible) {
            filterRow.find('th[data-col-idx="' + colIdx + '"]').toggle(visible);
          });
        };
        tblEl.DataTable(cfg);
      }

      initTable('dataTable', 0, DATE_COLUMNS_0, DATE_COL_ORDER_0);

    var tlf=document.querySelector('.theme-label-free');if(tlf)tlf.addEventListener('click', function(e) { e.preventDefault(); if (confirm('Dark Mode is a PRO feature.' + String.fromCharCode(10) + String.fromCharCode(10) + 'Would you like to upgrade to TablePop PRO?')) { window.open('https://pythonandvba.com/go/tablepop-checkout', '_blank'); } });
