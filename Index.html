                $.fn.dataTable.ext.search.push(function(settings,row){if(settings.nTable.id!==nTableId)return true;var op=opSel.val(),a=dateA.val();if(!op||!a)return true;var cell=row[colIdx];if(cell===''||cell===null||cell===undefined)return true;var cellMs=toDateMs(cell);if(isNaN(cellMs))return false;var aMs=Date.parse(a+'T00:00:00');if(op==='=')return cellMs>=aMs&&cellMs<=Date.parse(a+'T23:59:59');if(op==='>=')return cellMs>=aMs;if(op==='>')return cellMs>Date.parse(a+'T23:59:59');if(op==='<=')return cellMs<=Date.parse(a+'T23:59:59');if(op==='<')return cellMs<aMs;if(op==='..'){var b=dateB.val();return cellMs>=aMs&&cellMs<=(b?Date.parse(b+'T23:59:59'):Infinity);}return true;});
                dateA.on('change',function(){column.draw();});dateB.on('change',function(){column.draw();});

              exprInput.attr('placeholder',hint).attr('title','Use >, <, >=, <=, = operators or semicolons for multiple values');

                function parseNum(s){if(s===undefined||s===null||s==='')return NaN;s=s.toString().replace(/[^0-9.,\s-]/g,'');if(THOUSANDS_SEP)s=s.split(THOUSANDS_SEP).join('');if(DECIMAL_SEP!=='.')s=s.replace(DECIMAL_SEP,'.');return parseFloat(s);}
                function parseExpr(expr){var conditions=[],multiVals=[];var regex=/(>=|<=|>|<|=)\s*([0-9, \s-]+)/g;var m;while((m=regex.exec(expr))!==null){conditions.push({op:m[1],val:parseNum(m[2])});}if(conditions.length===0&&expr.trim()!==''){expr.split(';').forEach(function(part){var n=parseNum(part.trim());if(!isNaN(n))multiVals.push(n);});}return{conditions:conditions,multiVals:multiVals};}
                $.fn.dataTable.ext.search.push(function(settings,row){if(settings.nTable.id!==nTableId)return true;var expr=exprInput.val().trim();if(expr==='')return true;var parsed=parseExpr(expr);if(parsed.conditions.length===0&&parsed.multiVals.length===0)return true;var val=parseNum(row[colIdx]);if(isNaN(val))return false;if(parsed.multiVals.length>0)return parsed.multiVals.indexOf(val)!==-1;return parsed.conditions.every(function(c){switch(c.op){case'>':return val>c.val;case'<':return val<c.val;case'>=':return val>=c.val;case'<=':return val<=c.val;case'=':return val===c.val;default:return true;}});});

                menu.find('input[type="checkbox"]:not(#'+saId+')').on('change',updateFilter);selectAllItem.find('input').on('change',function(){menu.find('input[type="checkbox"]:not(#'+saId+')').prop('checked',$(this).prop('checked'));updateFilter();});
              })(menu,btn,column,colIdx,checkedVals,allSelected,nTableId,saId);
